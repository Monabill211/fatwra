<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نموذج</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:24px;font-family:Tahoma,Arial,sans-serif;background:#f3f1ec;color:#1d2a2a}
  .sheet{max-width:800px;margin:0 auto;background:#fff;border-top:10px solid #0f6b5c;padding:28px;border-radius:4px}
  .row{display:flex;gap:12px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #d6e4e1}
  .row input{font:inherit;font-size:17px;padding:10px 12px;border:1px solid #b9d3cd;border-radius:6px;background:#fff;color:#1d2a2a}
  .row .name{flex:0 0 38%;background:#eaf3f1;color:#0f6b5c;font-weight:700;border-color:#0f6b5c}
  .row .val{flex:1}
  button{font:inherit;font-size:17px;background:#0f6b5c;color:#fff;border:0;border-radius:6px;padding:12px 22px;cursor:pointer;margin-top:8px}
  @page{size:A4;margin:14mm}
  @media print{
    body{background:#fff;padding:0}
    .sheet{padding:0;max-width:none}
    button{display:none}
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="row"><input class="name" type="text"><input class="val" type="text"></div>
  <div class="row"><input class="name" type="text"><input class="val" type="text"></div>
  <div class="row"><input class="name" type="text"><input class="val" type="text"></div>
  <div class="row"><input class="name" type="text"><input class="val" type="text"></div>
  <div class="row"><input class="name" type="text"><input class="val" type="text"></div>
  <button onclick="window.print()">طباعة / حفظ PDF</button>
</div>
</body>
</html>
