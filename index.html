<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>فاتورة</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    padding:20px;
}
.inbut{
    margin: auto;
    margin: auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 46px;
}
input{
    width:45%;
    padding:10px;
    margin:10px 0;
}
h2{
    text-align: center;
}
button{
    padding:10px 20px;
    display: block;
    text-align: center;
    margin: auto;
    background: black;
    border: navajowhite;
    color: white;
    font-size: 24px;
    border-radius: 16px;
    font-weight: bold;
}

#invoice{
    margin: 53px auto;
    display: flex;
    flex-direction: column;
  
    font-size: 30px;
    gap: 20px;
}

.header{
    text-align:center;
}

.row{
    margin:10px 0;
}
.inbut{

}
</style>
</head>
<body>

<h2>إنشاء فاتورة</h2>
<div class="inbut">
<input id="customerName" placeholder="اسم العميل">
<input id="customerPhone" placeholder="رقم الهاتف">
<input id="productName" placeholder="اسم المنتج">
<input id="productCategory" placeholder="الصنف">
<input id="productPrice" placeholder="السعر">
</div>
<button onclick="generatePDF()">تحميل الفاتورة PDF</button>

<div id="invoice">

    <div class="header">
        <h1>فاتورة بيع</h1>
        <p id="date"></p>
    </div>

    <hr>

    <div class="row">
        <strong>اسم العميل:</strong>
        <span id="pdfCustomer"></span>
    </div>

    <div class="row">
        <strong>رقم الهاتف:</strong>
        <span id="pdfPhone"></span>
    </div>

    <div class="row">
        <strong>المنتج:</strong>
        <span id="pdfProduct"></span>
    </div>

    <div class="row">
        <strong>الصنف:</strong>
        <span id="pdfCategory"></span>
    </div>

    <div class="row">
        <strong>السعر:</strong>
        <span id="pdfPrice"></span> جنيه
    </div>

    <hr>

    <h3>
        الإجمالي:
        <span id="pdfTotal"></span>
        جنيه
    </h3>

</div>

<script>
function generatePDF(){

    document.getElementById("pdfCustomer").innerText =
        document.getElementById("customerName").value;

    document.getElementById("pdfPhone").innerText =
        document.getElementById("customerPhone").value;

    document.getElementById("pdfProduct").innerText =
        document.getElementById("productName").value;

    document.getElementById("pdfCategory").innerText =
        document.getElementById("productCategory").value;

    document.getElementById("pdfPrice").innerText =
        document.getElementById("productPrice").value;

    document.getElementById("pdfTotal").innerText =
        document.getElementById("productPrice").value;

    document.getElementById("date").innerText =
        "التاريخ: " + new Date().toLocaleDateString("ar-EG");

    const element = document.getElementById("invoice");

    html2pdf()
        .set({
            margin: 10,
            filename: "فاتورة.pdf",
            image: { type: "jpeg", quality: 1 },
            html2canvas: { scale: 2 },
            jsPDF: {
                unit: "mm",
                format: "a4",
                orientation: "portrait"
            }
        })
        .from(element)
        .save();
}
</script>

</body>
</html>
