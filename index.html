<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منشئ الفواتير</title>
 
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f2;--card:#fff;--tx:#1d2218;--mut:#667060;--bd:#d9ddd3;--g:#5f9a2a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a14;--card:#22261e;--tx:#eef1e9;--mut:#a3ab9a;--bd:#3a4033}}
:root[data-theme="dark"]{--bg:#171a14;--card:#22261e;--tx:#eef1e9;--mut:#a3ab9a;--bd:#3a4033}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
.controls{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px;color:var(--g)}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:14px}
textarea{min-height:60px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:grid;grid-template-columns:1fr 60px 80px 34px;gap:6px;margin-bottom:6px;direction:ltr}
.item button{border:0;background:#c0392b;color:#fff;border-radius:8px}
button.b{width:100%;padding:12px;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;margin-top:6px}
.add{background:var(--bd);color:var(--tx)}
.pr{background:var(--g);color:#fff;font-size:16px}
#wrap{display:flex;justify-content:center;padding:0 0 30px}
.paper{width:794px;min-height:1123px;background:#fff;color:#222;position:relative;direction:ltr;font-family:'Cairo',Arial,Helvetica,sans-serif;box-shadow:0 2px 12px #0003;overflow:hidden;flex:none}
.top{height:90px;background:var(--pc,#5f9a2a);clip-path:polygon(0 0,100% 0,100% 55%,78% 100%,0 70%)}
.bot{position:absolute;bottom:0;left:0;right:0;height:60px;background:var(--pc,#5f9a2a);clip-path:polygon(0 100%,100% 100%,100% 40%,35% 0,0 40%)}
.in{padding:0 56px 90px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-top:26px}
.logo{width:220px;height:120px;display:flex;align-items:center;font-weight:700;font-size:15px}
.logo img{max-width:220px;max-height:120px}
.inv{text-align:left;font-size:13px;line-height:1.7}
.inv b.t{font-size:18px;display:block;margin-bottom:6px}
.parties{display:flex;justify-content:space-between;margin-top:34px;min-height:120px;font-size:13px;gap:20px}
.parties>div{width:46%;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.6}
.parties h4{margin:0 0 8px;font-size:14px}
.ln{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-weight:600}
.ln svg{flex:none}
.ln span{min-width:0;overflow-wrap:anywhere}
.bl{font-weight:600;margin-bottom:6px}
.th,.tr{display:grid;grid-template-columns:minmax(0,1fr) 56px 112px 124px;gap:10px;padding:0 18px;align-items:center}
.th{background:var(--pc,#5f9a2a);color:#fff;font-weight:700;height:44px;border-radius:10px;font-size:15px}
.tr{min-height:46px;padding-top:7px;padding-bottom:7px;font-size:13px;line-height:1.5;break-inside:avoid}
.tr span:first-child{overflow-wrap:anywhere;word-break:break-word}
.tr>*:nth-child(n+2){white-space:nowrap}
.th>*:nth-child(n+2),.tr>*:nth-child(n+2){text-align:left}
.tot{margin-top:30px;border-top:1px solid #999;border-bottom:1px solid #999;padding:10px 18px;display:flex;justify-content:space-between;font-size:13px}
.pm{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.7;width:36%;padding-top:6px}
.sm{width:60%}
.sm div{display:grid;grid-template-columns:1fr 140px;height:30px;align-items:center}
.sm div span:first-child{font-weight:700;font-size:14px}
.sm div span:last-child{text-align:left}
.terms{padding:14px 18px;font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.terms b{font-size:15px;display:block}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff}
 .controls{display:none}
 #wrap{padding:0}
 .paper{zoom:1!important;box-shadow:none;width:210mm;min-height:297mm;overflow:visible}
 .tot,.terms{break-inside:avoid}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="controls">
 <div class="card"><h2>بيانات الفاتورة</h2>
  <div class="row"><div><label>رقم الفاتورة</label><input id="no" value="EA001201"></div>
  <div><label>التاريخ</label><input id="dt" type="date"></div></div>
 </div>
 <div class="card"><h2>المرسل والعميل</h2>
  <label>الشعار (اختياري)</label><input type="file" id="logo" accept="image/*">
  <label>اللون الأساسي</label><input type="color" id="pc" value="#5f9a2a" style="height:44px;padding:2px">
 </div>
 <div class="card"><h2>بيانات المرسل</h2>
  <label>الاسم</label><input id="fn" value="El Hamd - egc">
  <div class="row"><div><label>التليفون</label><input id="fph" value="0238044715"></div>
  <div><label>الإيميل</label><input id="fem" value="elhamd@herb.com"></div></div>
  <label>الموقع</label><input id="fweb" value="www.elhamd.com">
  <label>العنوان</label><input id="fad" value="13 st. giza egypt">
  <div class="row"><div><label>رقم التسجيل الضريبي</label><input id="ftx"></div>
  <div><label>السجل التجاري</label><input id="fcr"></div></div>
 </div>
 <div class="card"><h2>بيانات العميل (Bill To)</h2>
  <label>الاسم</label><input id="tn">
  <div class="row"><div><label>التليفون</label><input id="tph"></div>
  <div><label>الإيميل</label><input id="tem"></div></div>
  <label>العنوان</label><input id="tad">
 </div>
 <div class="card"><h2>الأصناف (الاسم / الكمية / السعر)</h2>
  <div id="items"></div>
  <button class="b add" id="add" type="button">+ إضافة صنف</button>
 </div>
 <div class="card"><h2>الحسابات</h2>
  <div class="row"><div><label>العملة</label><input id="cur" value="EGP"></div>
  <div><label>الضريبة %</label><input id="tax" type="number" value="14" step="any"></div></div>
  <label>الشحن</label><input id="ship" type="number" value="250" step="any">
  <label>طريقة الدفع</label><textarea id="pm">PAYMENT METHOD
FULL INVOICE AMOUNT
RECEIVED ONLINE
BANK ACCOUNT ENDING IN 2324</textarea>
  <label>الشروط والأحكام</label><textarea id="terms" style="min-height:110px">In case of an issue please use your invoice no. as your reference no. In case of an issue regarding this sale please give us a call at ________. Please check all products, in case of any issues mention it on the delivery sheet and sign. Delivery claims will not be accepted after the driver has left.</textarea>
 </div>
 <button class="b pr" id="print" type="button">طباعة / حفظ PDF</button>
 <button class="b add" id="new" type="button">فاتورة جديدة (يزود الرقم)</button>
</div>
<div id="wrap"><div class="paper" id="paper"></div></div>
<script>
var $=function(i){return document.getElementById(i)};
var items=[{n:"اسم الصنف",q:36,p:89.7},{n:"",q:18,p:112.5},{n:"",q:24,p:119.7},{n:"",q:12,p:134}];
var logoData="";
var MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function isoToday(){var d=new Date(),m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function fmtDate(v){var p=(v||"").split("-");if(p.length!=3)return "";return MN[+p[1]-1]+" "+(+p[2])+", "+p[0]}
var KEY="invNoV2";
function saveNo(){try{localStorage.setItem(KEY,$("no").value)}catch(e){}}
function nextNo(s){return s.replace(/(\d+)(\D*)$/,function(m,d,r){var n=String(+d+1);while(n.length<d.length)n="0"+n;return n+r})}
try{var sv=localStorage.getItem(KEY);if(sv)$("no").value=sv}catch(e){}
$("dt").value=isoToday();
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function f(n){return n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:false})}
function drawItems(){
 var h="";
 items.forEach(function(it,i){
  h+='<div class="item"><input data-i="'+i+'" data-k="n" value="'+esc(it.n)+'" placeholder="Item"><input data-i="'+i+'" data-k="q" type="number" value="'+it.q+'" step="any"><input data-i="'+i+'" data-k="p" type="number" value="'+it.p+'" step="any"><button type="button" data-d="'+i+'">×</button></div>';
 });
 $("items").innerHTML=h;
}
function ic(p){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--pc)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'}
var IC={u:ic('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'),p:ic('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>'),m:ic('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'),w:ic('<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20M12 2a15 15 0 000 20"/>'),a:ic('<path d="M12 21s7-6.5 7-12a7 7 0 00-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>')};
IC.d=ic('<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>');
function ln(i,id,pre){var v=$(id).value;return v?'<div class="ln">'+i+'<span>'+(pre||'')+esc(v)+'</span></div>':''}
function bl(id,pre){var v=$(id).value;return v?'<div class="bl">'+(pre||'')+esc(v)+'</div>':''}
function render(){
 $("paper").style.setProperty("--pc",$("pc").value);
 var c=$("cur").value,tr=parseFloat($("tax").value)||0,sh=parseFloat($("ship").value)||0,sub=0,rows="";
 items.forEach(function(it){
  var t=(+it.q||0)*(+it.p||0);sub+=t;
  rows+='<div class="tr"><span>'+esc(it.n)+'</span><span>'+(+it.q||0)+'</span><span>'+c+' '+f(+it.p||0)+'</span><span>'+c+' '+f(t)+'</span></div>';
 });
 var tax=Math.round(sub*tr)/100,total=sub+tax+sh;
 $("paper").innerHTML='<div class="top"></div><div class="in">'+
 '<div class="hd"><div class="logo">'+(logoData?'<img src="'+logoData+'">':'LOGO')+'</div><div class="inv"><b class="t">INVOICE</b>Invoice No: '+esc($("no").value)+'<br>Invoice Date: '+esc(fmtDate($("dt").value))+'</div></div>'+
 '<div class="parties"><div>'+ln(IC.u,"fn")+ln(IC.p,"fph")+ln(IC.m,"fem")+ln(IC.w,"fweb")+ln(IC.a,"fad")+ln(IC.d,"ftx","Tax Reg. No: ")+ln(IC.d,"fcr","Commercial Reg. No: ")+'</div><div><h4>BILL TO :</h4>'+bl("tn")+bl("tem","email ")+bl("tph")+bl("tad")+'</div></div>'+
 '<div class="th"><span>ITEM NAME</span><span>QTY</span><span>PRICE</span><span>TOTAL</span></div>'+rows+
 '<div class="tot"><div class="pm">'+esc($("pm").value)+'</div><div class="sm"><div><span>SUB TOTAL</span><span>'+c+' '+f(sub)+'</span></div><div><span>TAX('+tr+'%)</span><span>'+c+' '+f(tax)+'</span></div><div><span>SHIPPING</span><span>'+c+' '+f(sh)+'</span></div><div><span>TOTAL</span><span>'+c+' '+f(total)+'</span></div></div></div>'+
 '<div class="terms"><b>TERMS AND CONDITIONS</b>'+esc($("terms").value)+'</div></div><div class="bot"></div>';
 fit();
}
function fit(){
 var s=Math.min(1,(window.innerWidth-16)/794);
 $("paper").style.zoom=s;
}
$("items").addEventListener("input",function(e){
 var t=e.target,i=t.getAttribute("data-i");if(i===null)return;
 items[i][t.getAttribute("data-k")]=t.value;render();
});
$("items").addEventListener("click",function(e){
 var d=e.target.getAttribute("data-d");if(d===null)return;
 items.splice(+d,1);drawItems();render();
});
$("add").onclick=function(){items.push({n:"",q:1,p:0});drawItems();render()};
["no","dt","pc","fn","ftx","fcr","fph","fem","fweb","fad","tn","tph","tem","tad","cur","tax","ship","pm","terms"].forEach(function(i){$(i).addEventListener("input",render)});
$("logo").onchange=function(e){
 var file=e.target.files[0];if(!file)return;
 var r=new FileReader();r.onload=function(){logoData=r.result;render()};r.readAsDataURL(file);
};
$("no").addEventListener("input",saveNo);
$("print").onclick=function(){try{window.print()}catch(e){}};
$("new").onclick=function(){
 $("no").value=nextNo($("no").value);saveNo();$("dt").value=isoToday();
 items=[{n:"",q:1,p:0}];drawItems();render();
};
window.addEventListener("resize",fit);
window.addEventListener("beforeprint",function(){$("paper").style.zoom=1});
window.addEventListener("afterprint",fit);
drawItems();render();
</script>
</body>
</html>
